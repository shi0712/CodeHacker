[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codehacker-demo"
version = "0.1.0"
description = "A minimal reproduction of CodeHacker's two-phase adversarial testing workflow"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "CodeHacker contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["openai>=1.30", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
include = ["codehacker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
